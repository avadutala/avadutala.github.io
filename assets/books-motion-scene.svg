<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-labelledby="reading-motion-title reading-motion-desc" data-motion-scene="books" class="motion-scene books-motion-scene">
  <title id="reading-motion-title">A quiet moment in the reading room</title>
  <desc id="reading-motion-desc">An open book rests beside a stack of books and a brass reading lamp. A paper leaf gently rises, turns across the spine, and settles onto the other side.</desc>
  <defs>
    <linearGradient id="reading-paper-bg" x1="80" y1="30" x2="700" y2="600" gradientUnits="userSpaceOnUse"><stop stop-color="#ECECDE"/><stop offset="1" stop-color="#DADCC8"/></linearGradient>
    <linearGradient id="reading-brass" x1="555" y1="90" x2="660" y2="350" gradientUnits="userSpaceOnUse"><stop stop-color="#CDB078"/><stop offset=".45" stop-color="#A68950"/><stop offset="1" stop-color="#D3B77D"/></linearGradient>
    <radialGradient id="reading-lamp-light" cx="0" cy="0" r="1" gradientTransform="translate(550 245) rotate(90) scale(203 221)" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF1BC" stop-opacity=".48"/><stop offset="1" stop-color="#FFF1BC" stop-opacity="0"/></radialGradient>
    <linearGradient id="reading-page-left" x1="192" y1="346" x2="400" y2="395" gradientUnits="userSpaceOnUse"><stop stop-color="#F5ECD6"/><stop offset=".85" stop-color="#F9F1DD"/><stop offset="1" stop-color="#CFC3A7"/></linearGradient>
    <linearGradient id="reading-page-right" x1="400" y1="380" x2="610" y2="335" gradientUnits="userSpaceOnUse"><stop stop-color="#D8CDB3"/><stop offset=".18" stop-color="#FFF9E8"/><stop offset="1" stop-color="#F8F1DF"/></linearGradient>
  </defs>
