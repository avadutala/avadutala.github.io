<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-labelledby="cinema-motion-title cinema-motion-desc" data-motion-scene="cinema" class="motion-scene cinema-motion-scene">
  <title id="cinema-motion-title">Stories, set in motion</title>
  <desc id="cinema-motion-desc">A vintage film projector slowly turns two reels while a strip of film passes through it. A warm, steady beam falls onto a small screen. There is no flashing light.</desc>
  <defs>
    <linearGradient id="cinema-paper" x1="58" y1="0" x2="760" y2="600" gradientUnits="userSpaceOnUse"><stop stop-color="#EBE9DC"/><stop offset="1" stop-color="#D8DBC7"/></linearGradient>
    <linearGradient id="cinema-housing" x1="177" y1="285" x2="403" y2="408" gradientUnits="userSpaceOnUse"><stop stop-color="#345849"/><stop offset="1" stop-color="#183C33"/></linearGradient>
    <linearGradient id="cinema-beam" x1="445" y1="309" x2="709" y2="309" gradientUnits="userSpaceOnUse"><stop stop-color="#F7EAC1" stop-opacity=".86"/><stop offset="1" stop-color="#F7EAC1" stop-opacity=".22"/></linearGradient>
    <linearGradient id="cinema-reel-metal" x1="-70" y1="-70" x2="65" y2="80" gradientUnits="userSpaceOnUse"><stop stop-color="#D2BB86"/><stop offset=".55" stop-color="#B09660"/><stop offset="1" stop-color="#D8C18C"/></linearGradient>
    <clipPath id="cinema-screen-mask"><path d="M612 169h100v236H612z"/></clipPath>
  </defs>
  <path d="M0 0h800v600H0z" fill="url(#cinema-paper)"/>
  <circle cx="363" cy="280" r="235" fill="#F5F0DF" fill-opacity=".55"/>
  <circle cx="363" cy="280" r="253" stroke="#9AA583" stroke-opacity=".16"/>
  <path d="M79 500h644" stroke="#8B9775" stroke-opacity=".25"/>
  <ellipse cx="318" cy="507" rx="205" ry="21" fill="#526F51" fill-opacity=".13"/>
  <!-- A steady screen and beam avoid any simulated film flicker. -->
  <path d="M666 410v83m-30 0h60" stroke="#8B7950" stroke-width="6" stroke-linecap="round"/>
  <path d="M607 160h110v256H607z" fill="#46624B"/>
  <path d="M612 169h100v236H612z" fill="#F4EBD3"/>
  <g clip-path="url(#cinema-screen-mask)">
    <circle cx="675" cy="237" r="30" fill="#DBC18A" fill-opacity=".67"/>
    <path d="m597 354 67-71 61 70v59H597Z" fill="#ADB496"/>
    <path d="m603 389 71-64 66 57v36H603Z" fill="#879A78"/>
    <path d="m610 405 52-31 65 27v27H610Z" fill="#5D7B60"/>
  </g>
  <path d="M440 294 712 169v236L440 331Z" fill="url(#cinema-beam)"/>
  <path d="M442 296 711 173M442 329 711 402" stroke="#FFF2C5" stroke-opacity=".4"/>
  <!-- Film threads behind the body. Moving perforations remain slow and subtle. -->
  <path d="M210 268 193 312v62q0 29 36 29h100q39 0 39-39V231" stroke="#667451" stroke-width="17" stroke-linecap="round"/>
  <path data-cinema-film="" d="M210 268 193 312v62q0 29 36 29h100q39 0 39-39V231" stroke="#E5DCBD" stroke-width="5" stroke-dasharray="7 17" stroke-dashoffset="0"/>
  <path d="m219 267 24 37M359 230l-26 72" stroke="#8B774B" stroke-width="17" stroke-linecap="round"/>
  <!-- Rotating reel groups are local circles so they never wobble. -->
  <g transform="translate(210 193)">
    <circle cy="4" r="82" fill="#5E6B4C" fill-opacity=".16"/>
    <g data-cinema-reel-front="" transform="rotate(0)">
      <circle r="79" fill="#6C7250"/><circle r="74" fill="url(#cinema-reel-metal)"/>
      <circle r="66" stroke="#E3CE9B" stroke-width="1.5"/>
      <g fill="#3F5C48" stroke="#A68C58" stroke-width="2">
        <ellipse cy="-42" rx="15" ry="22"/><ellipse cy="-42" rx="15" ry="22" transform="rotate(60)"/><ellipse cy="-42" rx="15" ry="22" transform="rotate(120)"/><ellipse cy="-42" rx="15" ry="22" transform="rotate(180)"/><ellipse cy="-42" rx="15" ry="22" transform="rotate(240)"/><ellipse cy="-42" rx="15" ry="22" transform="rotate(300)"/>
      </g>
      <circle r="15" fill="#E0C38B" stroke="#8D7A4F" stroke-width="3"/><circle r="6" fill="#3A5641"/>
      <path d="M-7-6 7 6" stroke="#F3D9A0" stroke-width="3"/>
      <circle cx="-46" cy="-50" r="3" fill="#F7E4B3"/>
    </g>
  </g>
  <g transform="translate(365 165)">
    <circle cy="4" r="68" fill="#5E6B4C" fill-opacity=".15"/>
    <g data-cinema-reel-rear="" transform="rotate(0)">
      <circle r="66" fill="#66714F"/><circle r="61" fill="url(#cinema-reel-metal)"/>
      <circle r="54" stroke="#E3CE9B" stroke-width="1.3"/>
      <g fill="#3F5C48" stroke="#A68C58" stroke-width="1.6">
        <ellipse cy="-35" rx="12" ry="17"/><ellipse cy="-35" rx="12" ry="17" transform="rotate(72)"/><ellipse cy="-35" rx="12" ry="17" transform="rotate(144)"/><ellipse cy="-35" rx="12" ry="17" transform="rotate(216)"/><ellipse cy="-35" rx="12" ry="17" transform="rotate(288)"/>
      </g>
      <circle r="13" fill="#E0C38B" stroke="#8D7A4F" stroke-width="3"/><circle r="5" fill="#3A5641"/>
      <path d="M-6-5 6 5" stroke="#F3D9A0" stroke-width="2.5"/>
      <circle cx="38" cy="-33" r="2.6" fill="#F7E4B3"/>
    </g>
  </g>
  <!-- The projector is mechanically grounded on its own stand. -->
  <path d="M282 405v40m0-10-61 66m61-66 70 66" stroke="#736A47" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M221 501h-13m144 0h13" stroke="#3F5A43" stroke-width="9" stroke-linecap="round"/>
  <path d="M174 288q0-14 15-14h190q19 0 19 20v99q0 19-19 19H189q-15 0-15-15Z" fill="url(#cinema-housing)" stroke="#5C7453" stroke-width="2"/>
  <path d="M184 289h194" stroke="#8C9C73" stroke-opacity=".45" stroke-width="3"/>
  <path d="M398 293h31v42h-31z" fill="#A38B58"/><path d="M421 287h23v54h-23z" fill="#5B6A4B"/><path d="M441 291h12v46h-12z" fill="#BD9E62"/>
  <path d="M451 298v32" stroke="#E9CEA0" stroke-width="5" stroke-linecap="round"/>
  <rect x="200" y="302" width="137" height="79" rx="6" fill="#2C4B3A" stroke="#718664" stroke-opacity=".55"/>
  <g stroke="#102F28" stroke-width="4" stroke-linecap="round"><path d="M213 315h55M213 325h55M213 335h55M213 345h55M213 355h55M213 365h55"/></g>
  <g transform="translate(306 340)"><circle r="19" fill="#17362C" stroke="#A58B58" stroke-width="3"/><g data-cinema-takeup="" transform="rotate(0)"><path d="M-12 0h24M0-12v24" stroke="#A68D5B" stroke-width="3"/><circle r="5" fill="#D9BA7B"/></g></g>
  <circle cx="364" cy="362" r="11" fill="#AB704E" stroke="#CFAD77" stroke-width="2"/>
  <path d="M364 355v7" stroke="#EED8AF" stroke-width="2"/>
  <path d="M208 396h85" stroke="#84956A" stroke-opacity=".6"/>
  <circle cx="192" cy="288" r="2.5" fill="#B3B084"/><circle cx="382" cy="288" r="2.5" fill="#B3B084"/><circle cx="192" cy="398" r="2.5" fill="#B3B084"/><circle cx="382" cy="398" r="2.5" fill="#B3B084"/>
  <path d="M89 548h139" stroke="#8F9B7D" stroke-opacity=".6"/><circle cx="243" cy="548" r="3" fill="#B87954"/>
</svg>
